<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A K Editor | Customer Account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#07111f;color:#eef7ff;font-family:Arial,sans-serif}
.wrap{width:min(460px,100%);background:#102139;border:1px solid #29415d;border-radius:22px;padding:25px;box-shadow:0 18px 45px #0005}
h1{margin:0;color:#42dfff;text-align:center}p{color:#b6c6d8;line-height:1.55;text-align:center}
.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1;padding:12px;border-radius:10px;border:1px solid #34516e;background:#0a1728;color:#eaf6ff;font-weight:bold}
.tabs button.active{background:#42dfff;color:#06101f}
label{display:block;margin:14px 0 6px;font-weight:bold}input{width:100%;padding:13px;border-radius:10px;border:1px solid #36536d;background:#071522;color:white;font-size:16px}
.submit{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:linear-gradient(100deg,#8555ff,#42dfff);color:#06101f;font-weight:bold;font-size:16px}
#message{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}.links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:18px}.links a{color:#42dfff}
</style></head>
<body><main class="wrap">
<h1>✦ A K EDITOR</h1><p>Customer Account<br>अपना अकाउंट बनाकर Booking करें और अपनी सेवाएँ मैनेज करें।</p>
<div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create Account</button></div>
<form id="authForm">
<label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="कम से कम 8 characters">
<button class="submit" id="submitButton" type="submit">Login</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<div class="links"><a href="index.html">Home</a><a href="booking.html">Book Now</a><a href="tracking.html">Track Booking</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const client=window.supabase.createClient("https://okzwtylpmcyurkxvaocy.supabase.co","sb_publishable_PjYL34jyFif4E6eHc7HYJQ_y-5SAs0q");
const form=document.getElementById("authForm"), email=document.getElementById("email"), password=document.getElementById("password"), message=document.getElementById("message"), submitButton=document.getElementById("submitButton");
let mode="login";
function setMode(next){mode=next;document.getElementById("loginTab").classList.toggle("active",mode==="login");document.getElementById("signupTab").classList.toggle("active",mode==="signup");submitButton.textContent=mode==="login"?"Login":"Create Account";password.autocomplete=mode==="login"?"current-password":"new-password";message.textContent="";}
document.getElementById("loginTab").addEventListener("click",()=>setMode("login"));
document.getElementById("signupTab").addEventListener("click",()=>setMode("signup"));
form.addEventListener("submit",async e=>{e.preventDefault();submitButton.disabled=true;message.textContent="कृपया इंतज़ार करें...";
try{
 let result;
 if(mode==="signup"){result=await client.auth.signUp({email:email.value.trim(),password:password.value});if(result.error)throw result.error;
 if(result.data.session){message.textContent="Account बन गया! अब आप Booking कर सकते हैं।";location.href="booking.html";return;}
 message.textContent="Account बनाने का अनुरोध सफल है। अपने Email में confirmation link देखें, फिर यहाँ Login करें।";
 }else{result=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(result.error)throw result.error;message.textContent="Login सफल।";location.href=new URLSearchParams(location.search).get("next")==="payment"?"payment.html":"booking.html";}
}catch(err){message.textContent="समस्या: "+(err.message||"दोबारा कोशिश करें।");}finally{submitButton.disabled=false;}
});
client.auth.getSession().then(({data})=>{if(data.session){message.textContent="आप पहले से Login हैं। Booking पेज खोल रहे हैं...";location.href="booking.html";}});
</script></body></html>
